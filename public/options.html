<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotkey Translator — Cài đặt</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="page">
    <p id="unsupported-banner" class="banner banner-error" hidden></p>

    <header class="masthead">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5h9M8.5 5v2c0 3.6-2 6.4-4.5 8"/>
          <path d="M6 11.5c1.8 2.4 4 4 6.5 5"/>
          <path d="m13 20 4.2-10 4.2 10"/><path d="M14.8 16.4h4.8"/>
        </svg>
      </span>
      <div class="masthead-text">
        <h1 id="page-title"></h1>
        <p id="boot" class="subtitle"></p>
      </div>
    </header>

    <main>
      <section class="card" id="pairs" aria-labelledby="pairs-heading">
        <div class="card-head">
          <h2 id="pairs-heading"></h2>
          <button type="button" id="add-pair-btn" class="btn btn-primary"></button>
        </div>
        <ul id="pair-list" class="pair-list"></ul>
        <div id="pair-editor"></div>
      </section>

      <section class="card" id="commands" aria-labelledby="commands-heading">
        <div class="card-head">
          <h2 id="commands-heading"></h2>
          <button type="button" id="open-shortcuts-btn" class="btn btn-secondary"></button>
        </div>
        <p id="commands-intro" class="note"></p>
        <table id="commands-table">
          <thead>
            <tr><th id="commands-col-name"></th><th id="commands-col-shortcut"></th></tr>
          </thead>
          <tbody id="commands-tbody"></tbody>
        </table>
      </section>
    </main>
  </div>

  <template id="pair-row-template">
    <li class="pair-row">
      <div class="pair-main">
        <span class="pair-label"></span>
        <span class="pair-hotkey"></span>
      </div>
      <span class="pair-badge"></span>
      <progress class="pair-progress" max="100" value="0" hidden></progress>
      <div class="pair-actions">
        <button type="button" class="btn btn-secondary btn-download"></button>
        <button type="button" class="btn btn-secondary btn-cancel-download" hidden></button>
        <button type="button" class="btn btn-icon btn-edit" title="Sửa">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
          </svg>
        </button>
        <button type="button" class="btn btn-icon btn-danger btn-delete" title="Xoá">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/>
            <path d="M10 11v6M14 11v6"/>
          </svg>
        </button>
      </div>
    </li>
  </template>

  <!-- MV3 CSP cam inline script - phai nap qua src -->
  <script src="options-entry.js"></script>
</body>
</html>
